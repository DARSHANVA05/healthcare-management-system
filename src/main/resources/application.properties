# === App Info ===
spring.application.name=healthcare-management-system
server.port=9090

# === Database Config ===
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_system
spring.datasource.username=root
spring.datasource.password=darshan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Hibernate and SQL logs ===
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# === Mail Config ===
# Using Gmail SMTP for sending notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-mail-id@gmail.com
spring.mail.password=your-password-key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === Thymeleaf Templating ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === Ollama Llama3 AI Integration ===
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.5
spring.ai.ollama.chat.options.format=json
